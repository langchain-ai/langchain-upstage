name: py314-pin-check

# Scoped investigation for a tokenizers pin fix — not part of the shared
# _test.yml / _integration_test.yml templates (those stay at their
# current 3.10/3.11 matrix; changing them would affect every libs/*
# package). Runs only on this fix branch.

on:
  push:
    branches:
      - "fix/relax-tokenizers-pin"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  POETRY_VERSION: "1.7.1"

jobs:
  build:
    defaults:
      run:
        working-directory: libs/upstage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"
    name: "install + test #${{ matrix.python-version }}"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }} + Poetry ${{ env.POETRY_VERSION }}
        uses: ./.github/actions/poetry_setup
        with:
          python-version: ${{ matrix.python-version }}
          poetry-version: ${{ env.POETRY_VERSION }}
          working-directory: libs/upstage
          cache-key: py314-pin-check

      - name: Install dependencies (test + test_integration)
        run: poetry install --with test,test_integration

      - name: Run unit tests
        run: make test

      - name: Run a real Solar integration test (ChatUpstage)
        env:
          UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}
        run: poetry run pytest tests/integration_tests/test_chat_models.py -v
